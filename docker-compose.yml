services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: mision_emprende_dynamodb_local
    restart: unless-stopped
    # -inMemory: local dev data doesn't need to survive a restart (seed
    # commands re-run every container start anyway) -- avoids the
    # dynamodb-local image's default non-root user being unable to write
    # its SQLite file to a freshly-created named volume.
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    working_dir: /home/dynamodblocal
    ports:
      - "8001:8000"
    networks:
      - mision_emprende_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mision_emprende_backend
    restart: unless-stopped
    command:
      - gunicorn
      - mision_emprende_backend.wsgi:application
      - --bind
      - "0.0.0.0:8000"
      - --workers
      - "4"
      - --timeout
      - "120"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=True
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000
      - DYNAMODB_ENDPOINT_URL=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - USERS_TABLE=UsersTable
      - GAME_SESSIONS_TABLE=GameSessionTable
      - CONTENT_TABLE=ContentTable
    depends_on:
      - dynamodb-local
    networks:
      - mision_emprende_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: mision_emprende_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    networks:
      - mision_emprende_network

volumes:
  static_volume:
  media_volume:

networks:
  mision_emprende_network:
    driver: bridge
