AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Mision Emprende -- fully serverless stack (AWS Academy Learner Lab).
  Django REST API on Lambda (Web Adapter), WebSocket real-time layer,
  DynamoDB for all persistence (game_sessions/users/academic/challenges/
  admin_dashboard), S3+Firehose+Athena for admin_dashboard analytics.
  No relational database anywhere -- RDS MySQL (users/academic/challenges)
  was retired 2026-08-04 once those apps finished their DynamoDB cutover
  (see docs/superpowers/specs/2026-08-03-academic-challenges-dynamodb-migration-design.md).

  NOTE: WS handlers (lambda/ws-*) and the stream-to-firehose Lambda are
  stubs -- see the migration plan for which tasks fill them in. Canary
  (AutoPublishAlias/DeploymentPreference) is intentionally left off every
  function until the base stack deploys successfully once.

Parameters:
  LabRoleArn:
    Type: String
    Description: >
      ARN of the pre-provisioned AWS Academy Learner Lab execution role.
      IAM role creation is typically blocked on these accounts, so every
      Lambda below is pinned to this role instead of letting SAM
      auto-generate one.
  DjangoSecretKey:
    Type: String
    NoEcho: true

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:

  # ==========================================================
  # Django REST API (Lambda Web Adapter, container image)
  # ==========================================================

  DjangoFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          SECRET_KEY: !Ref DjangoSecretKey
          DEBUG: 'False'
          # 127.0.0.1 required so the Lambda Web Adapter's internal readiness
          # probe (curls localhost inside the container) isn't rejected.
          ALLOWED_HOSTS: !Sub "127.0.0.1,localhost,.execute-api.${AWS::Region}.amazonaws.com"
          STATIC_MEDIA_BUCKET: !Ref StaticMediaBucket
          GAME_SESSIONS_TABLE: !Ref GameSessionTable
          USERS_TABLE: !Ref UsersTable
          CONTENT_TABLE: !Ref ContentTable
          # game_sessions/broadcast.py async-invokes this rather than calling
          # ConnectionsTable/apigatewaymanagementapi directly -- see
          # BroadcastFunction's comment for why.
          BROADCAST_FUNCTION_NAME: !Ref BroadcastFunction
      Events:
        RootApi:
          Type: Api
          Properties:
            RestApiId: !Ref DjangoApi
            Path: /
            Method: ANY
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref DjangoApi
            Path: /{proxy+}
            Method: ANY
    Metadata:
      Dockerfile: Dockerfile.lambda
      DockerContext: .
      DockerTag: latest

  DjangoApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      # Without this, API Gateway treats every request/response body as
      # UTF-8 text and mangles binary payloads in transit -- e.g. an
      # uploaded .xlsx (a ZIP archive) arrives corrupted at the Lambda
      # ("bad offset for central directory" from openpyxl/zipfile).
      # "*/*" is the standard fix when fronting Lambda Web Adapter with a
      # REST API: LWA already base64-decodes the request body and
      # base64-encodes binary responses, this just tells API Gateway to
      # treat everything as binary-eligible so that machinery kicks in.
      BinaryMediaTypes:
        - "*/*"

  # ==========================================================
  # Static / media (Lambda has no persistent disk)
  # ==========================================================

  StaticMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ==========================================================
  # DynamoDB: game_sessions runtime data (single-table)
  # ==========================================================
  # PK/SK scheme filled in by the "DynamoDB single-table design for
  # game_sessions" task. Placeholder generic key names below so every
  # entity (GameSession/Team/TeamStudent/TeamActivityProgress/SessionStage/
  # ReflectionEvaluation/TokenTransaction/TeamBubbleMap/TeamPersonalization/
  # Tablet/SessionGroup) can share this one table.

  GameSessionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # ==========================================================
  # DynamoDB: users (professors/administrators/students/access codes)
  # ==========================================================
  # See docs/superpowers/specs/2026-07-29-users-dynamodb-migration-design.md.
  # Separate from GameSessionTable - a different bounded context (auth)
  # with its own access patterns (login by username/email), not the
  # game-runtime hot path.

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ==========================================================
  # DynamoDB: academic + challenges + admin_dashboard content
  # ==========================================================
  # See docs/superpowers/specs/2026-08-03-academic-challenges-dynamodb-
  # migration-design.md. Shared by academic (Faculty/Career/Course),
  # challenges (Stage/Activity/.../GeneralKnowledgeQuestion) and
  # admin_dashboard's metric-cache models -- the first table in this
  # codebase shared across apps, since these are small/tightly-coupled
  # catalog entities that don't justify 3 separate tables. Item ids reuse
  # the existing RDS auto-increment integers (stringified), not fresh
  # UUIDs, because game_sessions DynamoDB items already reference these
  # ids (course_id, current_stage_id, current_activity_id).

  ContentTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ==========================================================
  # DynamoDB: WebSocket connection tracking
  # ==========================================================

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: room_code
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RoomCodeIndex
          KeySchema:
            - AttributeName: room_code
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ==========================================================
  # WebSocket API (raw ApiGatewayV2 -- not expressible via SAM's
  # Api/HttpApi event types)
  # ==========================================================

  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: mision-emprende-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WsConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: lambda/ws-connect/
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          GAME_SESSIONS_TABLE: !Ref GameSessionTable

  WsDisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: lambda/ws-disconnect/
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable

  WsDefaultFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: lambda/ws-default/
      Role: !Ref LabRoleArn

  # DjangoFunction async-invokes this instead of calling ConnectionsTable/
  # apigatewaymanagementapi directly, historically because DjangoFunction
  # used to run inside a VPC (for RDS) that couldn't reach the WebSocket
  # Management API without extra PrivateLink plumbing. DjangoFunction left
  # the VPC once RDS was retired (2026-08-04), so that constraint no longer
  # applies, but the indirection is harmless and not worth unwinding.
  BroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.11
      Handler: handler.handler
      CodeUri: lambda/broadcast/
      Role: !Ref LabRoleArn
      Timeout: 10
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
          WS_API_ENDPOINT: !Sub "${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"

  WsConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsConnectFunction.Arn}/invocations

  WsDisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDisconnectFunction.Arn}/invocations

  WsDefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsDefaultFunction.Arn}/invocations

  WsConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub integrations/${WsConnectIntegration}

  WsDisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub integrations/${WsDisconnectIntegration}

  WsDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub integrations/${WsDefaultIntegration}

  WsConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsConnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  WsDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDisconnectFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  WsDefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WsDefaultFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*

  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WsConnectRoute
      - WsDisconnectRoute
      - WsDefaultRoute
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      DeploymentId: !Ref WebSocketDeployment
      StageName: prod

  # ==========================================================
  # admin_dashboard analytics: DynamoDB Streams -> Firehose -> S3 -> Athena
  # ==========================================================

  AnalyticsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AnalyticsDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt AnalyticsBucket.Arn
        RoleARN: !Ref LabRoleArn
        Prefix: "game_sessions/dt=!{timestamp:yyyy-MM-dd}/"
        ErrorOutputPrefix: "errors/"
        BufferingHints:
          IntervalInSeconds: 300
          SizeInMBs: 5

  StreamToFirehoseFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      CodeUri: lambda/stream-to-firehose/
      Role: !Ref LabRoleArn
      Environment:
        Variables:
          DELIVERY_STREAM_NAME: !Ref AnalyticsDeliveryStream
      Events:
        GameSessionStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt GameSessionTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 30

  AthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: mision-emprende-analytics
      WorkGroupConfiguration:
        ResultConfiguration:
          OutputLocation: !Sub s3://${AnalyticsBucket}/athena-results/

  AnalyticsGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: mision_emprende_analytics

Outputs:
  DjangoApiUrl:
    Value: !Sub https://${DjangoApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
  WebSocketUrl:
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod/
  GameSessionTableName:
    Value: !Ref GameSessionTable
  UsersTableName:
    Value: !Ref UsersTable
  ContentTableName:
    Value: !Ref ContentTable
  ConnectionsTableName:
    Value: !Ref ConnectionsTable
  StaticMediaBucketName:
    Value: !Ref StaticMediaBucket
  AnalyticsBucketName:
    Value: !Ref AnalyticsBucket
